services:
  db:
    image: postgres:16-alpine
    container_name: agencyos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agencyos
    volumes:
      - agencyos-db-data:/var/lib/postgresql/data
    networks:
      - agencyos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyos"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agencyos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
    networks:
      - agencyos-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agencyos.rule=Host(`app.moovelinks.com.br`)"
      - "traefik.http.routers.agencyos.entrypoints=websecure"
      - "traefik.http.routers.agencyos.tls.certresolver=letsencrypt"
      - "traefik.http.services.agencyos.loadbalancer.server.port=3000"

networks:
  agencyos-internal:
    driver: bridge

volumes:
  agencyos-db-data:
